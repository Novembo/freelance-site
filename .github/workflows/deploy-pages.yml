name: Publier le site sur GitHub Pages

# Se déclenche automatiquement à chaque push sur main.
# Ne publie que le frontend statique (public/index.html) — pas le dossier backend/,
# qui doit tourner ailleurs (voir README.md).
#
# Réglage requis : Settings → Secrets and variables → Actions → onglet Variables
#   API_BASE = https://ton-backend.onrender.com   (sans slash final)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      API_BASE: ${{ vars.API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le dossier à publier (frontend uniquement)
        run: |
          mkdir _site
          cp public/index.html _site/
          if [ -n "$API_BASE" ]; then
            sed -i "s|__API_BASE__|${API_BASE%/}|g" _site/index.html
          else
            echo "::warning::Variable API_BASE absente : le site publié n'atteindra pas l'API."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

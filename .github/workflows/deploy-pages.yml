name: Publier le site sur GitHub Pages

# Se déclenche automatiquement à chaque push sur main.
# Ne publie que le frontend compilé (dist/) — pas le dossier backend/,
# qui doit tourner ailleurs (voir README.md).
#
# Réglage requis : Settings → Secrets and variables → Actions → onglet Variables
#   API_BASE = https://ton-backend.onrender.com   (sans slash final)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      API_BASE: ${{ vars.API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Compiler le frontend
        run: |
          npm ci
          npm run build

      - name: Configurer l'URL de l'API
        run: |
          if [ -n "$API_BASE" ]; then
            sed -i "s|__API_BASE__|${API_BASE%/}|g" dist/index.html
          else
            echo "::warning::Variable API_BASE absente : le site publié n'atteindra pas l'API."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
